# Builds and publishes a release when a version tag is pushed.
#
# main.js is a build artifact and is not tracked, so it cannot be attached by
# hand from a clean checkout -- CI builds it here and uploads it. The tag must
# equal the version in manifest.json exactly and carry no "v" prefix: that is
# what Obsidian looks for when it installs a plugin.
name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - run: npm ci

      - name: Verify the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - run: npm test

      - run: npm run build

      # A full release, not a pre-release: the community directory and the
      # plugin installer only look at full releases
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See the README for status and known limitations." \
            main.js manifest.json
